name: macOS checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-app:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check document behaviour
        run: bash scripts/check.sh
      - name: Check PDE model identities
        run: python3 scripts/check_pde_models.py
      - name: Build the native app
        run: bash scripts/build.sh
      - name: Verify signature and package
        run: |
          codesign --verify --deep --strict build/Whiteboard.app
          ditto -c -k --norsrc --keepParent build/Whiteboard.app build/Whiteboard-macOS.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Whiteboard-macOS-preview
          path: build/Whiteboard-macOS.zip
          if-no-files-found: error
          retention-days: 14
